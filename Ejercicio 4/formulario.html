<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
            <h1>Formulario Médico</h1>
    </header>
    <main>
            <form>
                <div>
                    <label for="fullname">Ingrese su Nombre y Apellido:</label>
                    <input type="text" id="fullname" name="fullname" required maxlength="50" minlength="3" placeholder="John Doe">
                </div>
                <div>
                    <label for="correo">Ingrese su Correo:</label>
                    <input type="email" id="correo" name="correo" required placeholder="john.doe@example.com">
                </div>
                <div>
                    <label for="fecha">Ingrese el día del turno:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div>
                    <span>Ingrese el horario de su preferencia:</span>
                        <div>
                            <label for="Mañana">Mañana</label>
                            <input type="radio" id="Mañana" name="horario"> 
                        </div>
                          <div>
                            <label for="Tarde">Tarde</label>
                            <input type="radio" id="Tarde" name="horario"> 
                        </div>
                <div>
                    <label for="submit">Solicitar Turno</label>
                    <input type="submit" id="submit" name="submit">
                </div>
                </div>
            </form>
    </main>
    <footer>    

    </footer>
</body>
</html>
