<body>
    <!-- 
        display 
                inline (solo ocupa el ancho de su contenido)
                No pueden cambiar sus dimensiones
                Si hay espacio disponible se alinean con otros elementos inline o inline-block
                Solo pueden recibir margin y padding horizontal
                No pueden recibir margin y padding vertical
                ej: span, a, label

                block (ocupan todo el ancho de pantalla por defecto )
                Pueden cambiar sus direcciones
                No se pueden poner uno al lado del otro. Ocupa todo el ancho
                   ej: div, h1...h6, p, etiqueta semantica, form
                
                   inline-block (solo ocupa el ancho de su contenido)
                Pueden cambiar sus direcciones
                Si hay espacio disponible se alinean con otros elementos inline o inline-block
                   ej: button, input, select, textarea, imagen, iframe
    -->

        <span>Hola</span>
